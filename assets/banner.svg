<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .tagline-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        fill: #38bdf8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      
      /* Subtle Background Animations */
      @keyframes floatParticle1 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-30px) translateX(20px); opacity: 0.7; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes floatParticle2 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(25px) translateX(-25px); opacity: 0.6; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes pulseGlow {
        0% { r: 120px; opacity: 0.25; }
        50% { r: 160px; opacity: 0.45; }
        100% { r: 120px; opacity: 0.25; }
      }
      @keyframes scanline {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }

      .particle-1 { animation: floatParticle1 8s ease-in-out infinite; }
      .particle-2 { animation: floatParticle2 11s ease-in-out infinite; }
      .pulsing-orb-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 150px 100px; }
      .pulsing-orb-2 { animation: pulseGlow 7s ease-in-out infinite reverse; transform-origin: 1050px 300px; }
      .stream-line { stroke-dasharray: 60, 180; animation: scanline 7s linear infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Outer Elegant Border -->
  <rect x="1.5" y="1.5" width="1197" height="397" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Background Dynamic Glowing Orbs (Deep in background) -->
  <g opacity="0.6">
    <circle class="pulsing-orb-1" cx="160" cy="110" r="130" fill="#38bdf8" filter="url(#glow)"/>
    <circle class="pulsing-orb-2" cx="1040" cy="290" r="140" fill="#a855f7" filter="url(#glow)"/>
    <circle cx="920" cy="90" r="90" fill="#6366f1" filter="url(#glow)" opacity="0.3"/>
    <circle cx="280" cy="320" r="100" fill="#0ea5e9" filter="url(#glow)" opacity="0.25"/>
  </g>

  <!-- Technical Circuit Grid Lines in Background -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Flow Data Stream Lines -->
  <g fill="none" stroke-width="2">
    <path class="stream-line" d="M -50,80 Q 300,140 600,60 T 1250,90" stroke="#38bdf8" opacity="0.6"/>
    <path class="stream-line" d="M -50,320 Q 350,260 700,340 T 1250,300" stroke="#c084fc" opacity="0.6" style="animation-duration: 9s;"/>
  </g>

  <!-- Animated Particles/Floating Geometry (Background Layer) -->
  <g>
    <rect class="particle-1" x="120" y="70" width="8" height="8" rx="2" fill="#38bdf8" transform="rotate(45 124 74)"/>
    <rect class="particle-2" x="1060" y="110" width="10" height="10" rx="3" fill="#a855f7" transform="rotate(30 1065 115)"/>
    <circle class="particle-1" cx="980" cy="330" r="4" fill="#60a5fa"/>
    <circle class="particle-2" cx="180" cy="280" r="5" fill="#f43f5e"/>
    <polygon class="particle-1" points="860,60 868,75 852,75" fill="#fbbf24" opacity="0.5"/>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle (Guaranteed 100% Crisp Visibility) -->
  
  <!-- Category Tagline Badge -->
  <g transform="translate(600, 68)">
    <rect x="-190" y="-18" width="380" height="34" rx="17" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#cardShadow)"/>
    <circle cx="-165" cy="-1" r="5" fill="#10b981"/>
    <text class="tagline-text" x="5" y="4" text-anchor="middle">⚡ CURATED FINTECH &amp; BILLING ECOSYSTEM</text>
  </g>

  <!-- Primary Main Title (Gradient Fill + Drop Shadow) -->
  <text class="title-text" x="600" y="145" text-anchor="middle" fill="url(#textGrad)" filter="url(#cardShadow)">
    Awesome Advanced Electronic Invoicing
  </text>

  <!-- Subtitle -->
  <text class="subtitle-text" x="600" y="195" text-anchor="middle">
    AP Automation • Usage-Based Metering • Global Rails • Open-Source Platforms
  </text>

  <!-- Feature Pills / Highlights Row in Foreground -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: SaaS Leaders -->
    <g transform="translate(-400, 0)">
      <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2"/>
      <text class="pill-text" x="0" y="6" text-anchor="middle">🏢 Enterprise SaaS</text>
    </g>

    <!-- Pill 2: Open Source -->
    <g transform="translate(-200, 0)">
      <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#1e293b" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.2"/>
      <text class="pill-text" x="0" y="6" text-anchor="middle">🔓 Open-Source AR/AP</text>
    </g>

    <!-- Pill 3: Usage Billing -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#1e293b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.2"/>
      <text class="pill-text" x="0" y="6" text-anchor="middle">⏱️ Metered Billing</text>
    </g>

    <!-- Pill 4: Global Payments -->
    <g transform="translate(200, 0)">
      <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#1e293b" fill-opacity="0.9" stroke="#0ea5e9" stroke-width="1.2"/>
      <text class="pill-text" x="0" y="6" text-anchor="middle">🌍 Global Rails</text>
    </g>

    <!-- Pill 5: AI Reconciliation -->
    <g transform="translate(400, 0)">
      <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#1e293b" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2"/>
      <text class="pill-text" x="0" y="6" text-anchor="middle">🤖 AI Reconciliation</text>
    </g>
  </g>

  <!-- Bottom Interactive Cue / Star Notice -->
  <g transform="translate(600, 345)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">
      ⭐ Star on GitHub &amp; Explore Top Open-Source &amp; Commercial Billing Systems
    </text>
  </g>
</svg>